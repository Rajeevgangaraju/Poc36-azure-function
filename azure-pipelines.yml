trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

- script: |
    npm install
    npm run build
  displayName: 'Install dependencies and build'

- script: |
    curl https://microsoft.com | gpg --dearmor > microsoft.gpg
    sudo mv microsoft.gpg /etc/apt/trusted.gpg.d/microsoft.gpg
    sudo sh -c 'echo "deb [arch=amd64] https://microsoft.com jammy main" > /etc/apt/sources.list.d/dotnetdev.list'
    sudo apt-get update
    sudo apt-get install azure-functions-core-tools-4
  displayName: 'Install Azure Functions Core Tools'

- task: AzureCLI@2
  displayName: 'Publish Azure Function'
  inputs:
    azureSubscription: 'Azure-Subscription-Conn'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      STORAGE_CONN=$(az storage account show-connection-string --name poc36storagecenter --resource-group rg-poc36 --query connectionString -o tsv)
      az functionapp config appsettings set --name poc36-function --resource-group rg-poc36 --settings AzureWebJobsStorage="$STORAGE_CONN" WEBSITE_CONTENTAZUREFILECONNECTIONSTRING="$STORAGE_CONN" WEBSITE_CONTENTSHARE="poc36-function-share" FUNCTIONS_WORKER_RUNTIME="node"
      func azure functionapp publish poc36-function --typescript

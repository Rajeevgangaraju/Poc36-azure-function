- task: AzureCLI@2
  displayName: 'Publish Azure Function'
  inputs:
    azureSubscription: 'YOUR_SERVICE_CONNECTION_NAME' # <--- Ensure this matches your Service Connection name
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # 1. Dynamically grab the connection string of the storage account you just created
      # Change 'poc36storage' and 'YOUR_RESOURCE_GROUP' to your exact names
      STORAGE_CONN=$(az storage account show-connection-string --name poc36storage --resource-group YOUR_RESOURCE_GROUP --query connectionString -o tsv)
      
      # 2. Force apply the connection strings and create the content file share configs
      az functionapp config appsettings set --name poc36-function --resource-group YOUR_RESOURCE_GROUP --settings \
        AzureWebJobsStorage="$STORAGE_CONN" \
        WEBSITE_CONTENTAZUREFILECONNECTIONSTRING="$STORAGE_CONN" \
        WEBSITE_CONTENTSHARE="poc36-function-share" \
        FUNCTIONS_WORKER_RUNTIME="node"
        
      # 3. Execute the publish operation now that settings are validated
      func azure functionapp publish poc36-function --typescript
